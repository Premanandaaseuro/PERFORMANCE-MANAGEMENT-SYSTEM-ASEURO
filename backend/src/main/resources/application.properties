spring.application.name=pms

# PostgreSQL DataSource Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:pms_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# JWT Properties
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expirationMs=86400000
jwt.expiration-ms=86400000
pms.auth.lock-duration-seconds=300

# Report storage directory
app.reports.dir=./reports

# Server port
server.port=${SERVER_PORT:8081}

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.aseuro.pms=DEBUG

# Enable Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Email Configuration (Brevo HTTPS REST API over Port 443 - Zero Port Block)
brevo.api.key=${BREVO_API_KEY:}
app.mail.from=${MAIL_FROM:m.premananda@aseuro.in}
app.portal.url=${PORTAL_URL:https://pms-frontend-kz6u.onrender.com/login}
app.company.id=${COMPANY_ID:aseurotechnolog}
app.company.name=${COMPANY_NAME:Aseuro Technologies}
app.website.url=${COMPANY_WEBSITE_URL:https://aseuro.in}
