spring.application.name=pms

# PostgreSQL DataSource Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:pms_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# JWT Properties
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expirationMs=86400000
jwt.expiration-ms=86400000
pms.auth.lock-duration-seconds=300

# Report storage directory
app.reports.dir=./reports

# Server port
server.port=${SERVER_PORT:8081}

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.aseuro.pms=DEBUG

# Enable Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Email Configuration (Brevo Free SMTP)
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:b76bc3001@smtp-brevo.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# App Portal URL & Company details for emails
app.mail.from=${MAIL_FROM:premanandabspp@gmail.com}
app.portal.url=${PORTAL_URL:https://pms-frontend-kz6u.onrender.com/login}
app.company.id=${COMPANY_ID:aseurotechnolog}
app.company.name=${COMPANY_NAME:Aseuro Technologies}
